name: Value Bet próba Telegram

# Kézzel indítható: küld egy próba Telegram-üzenetet (megy-e a felhős push).
on:
  workflow_dispatch: {}

jobs:
  test-telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Próba Telegram küldése
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tg_test.py
