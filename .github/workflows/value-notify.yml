name: Value Bet értesítő (lassú / tartalék)

# TARTALÉK egyszer-fut megoldás. A gyors, folyamatos figyelőt a
# "value-watch.yml" adja (~90 mp). Itt az ütemezést KIKAPCSOLTUK, hogy a kettő
# ne küldjön dupla emailt (közös notified.json). Ezt csak kézzel indítsd, ha
# egyetlen gyors keresést akarsz futtatni.
on:
  workflow_dispatch: {}       # csak kézi indítás
  # schedule:                 # kikapcsolva – a value-watch.yml veszi át
  #   - cron: "*/15 * * * *"

permissions:
  contents: write             # a notified.json visszaírásához

concurrency:
  group: value-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Kereső + email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_cron.py

      - name: Állapot mentése (notified.json)
        run: |
          git config user.name "value-bet-bot"
          git config user.email "value-bet-bot@users.noreply.github.com"
          git add notified.json || true
          git commit -m "update notified state [skip ci]" || echo "nincs változás"
          git push || echo "push kihagyva"
